[project]
name = "amazon-ads-api-workspace"
version = "0.11.0"
description = "Amazon Ads API SDK (Sync & Async) Workspace"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
]

[tool.uv.workspace]
members = [
    "packages/async",
    "packages/sync",
]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "mypy>=1.15.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "black>=26.3.1",
    "pyrefly>=1.0.0",
    "hatchling>=1.21.0",
    "twine>=6.0.0",
    "redis>=5.0.0",
    "pyyaml>=6.0.3",
]

[tool.black]
line-length = 120
target-version = ["py313"]

[tool.ruff]
src = ["packages/async/src", "packages/sync/src", "codegen"]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
"**/models/**" = ["E501", "F403", "N815"]
"**/client/**" = ["E501"]
"codegen/v0/codegen/*" = ["E501"]
"codegen/v1/codegen/*" = ["E501"]
"tests/conftest.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["sync"]
markers = [
    "e2e: tests that call a live ads_v1_server over HTTP",
]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_ignores = true
exclude = []

[tool.pyrefly]
project-excludes = []
python-version = "3.13.0"
preset = "legacy"
