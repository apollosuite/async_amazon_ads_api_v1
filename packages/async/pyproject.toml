[project]
name = "async-amazon-ads-api-v1"
dynamic = ["version"]
description = "Pure async Amazon Ads API client — v0 and v1 (SP, SB, SD, DSP, ST, and more)"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Jack", email = "zhangwenguang@apollosuite.com" }]
keywords = ["amazon", "ads", "ads-api", "advertising", "sponsored-products", "sponsored-brands", "sponsored-display", "async", "api-v1"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

dependencies = [
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
]

[project.optional-dependencies]
redis = ["redis>=5.0.0"]

[project.urls]
Homepage = "https://github.com/apollosuite/async_amazon_ads_api_v1"
Repository = "https://github.com/apollosuite/async_amazon_ads_api_v1"
Issues = "https://github.com/apollosuite/async_amazon_ads_api_v1/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/ads_api/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ads_api"]

[tool.hatch.build.targets.sdist]
only-include = ["src/ads_api", "README.md", "pyproject.toml"]
